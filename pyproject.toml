[project]
name = "linguaklang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chatterbox-tts>=0.1.3",
    "noisereduce>=3.0.3",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "pydantic-settings>=2.14.1",
    "python-telegram-bot>=22.7",
    "resemble-perth",
    "soundfile>=0.14.0",
    "strands>=0.1.0",
    "strands-agents>=1.42.0",
    "torch==2.6.0",
]
[tool.uv.extra-build-dependencies]
pkuseg = ["numpy"]

[tool.uv.sources]
resemble-perth = { git = "https://github.com/resemble-ai/perth.git" }


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.16",
    "ty>=0.0.46",
]

